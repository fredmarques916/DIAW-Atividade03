<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Outer border -->
  <rect x="10" y="2" width="12" height="2" fill="#111111"/>
  <rect x="6" y="4" width="4" height="2" fill="#111111"/>
  <rect x="22" y="4" width="4" height="2" fill="#111111"/>
  <rect x="4" y="6" width="2" height="4" fill="#111111"/>
  <rect x="26" y="6" width="2" height="4" fill="#111111"/>
  <rect x="2" y="10" width="2" height="12" fill="#111111"/>
  <rect x="28" y="10" width="2" height="12" fill="#111111"/>
  <rect x="4" y="22" width="2" height="4" fill="#111111"/>
  <rect x="26" y="22" width="2" height="4" fill="#111111"/>
  <rect x="6" y="26" width="4" height="2" fill="#111111"/>
  <rect x="22" y="26" width="4" height="2" fill="#111111"/>
  <rect x="10" y="28" width="12" height="2" fill="#111111"/>

  <!-- Top Half (Red) -->
  <rect x="10" y="4" width="12" height="2" fill="#ee1515"/>
  <rect x="6" y="6" width="20" height="4" fill="#ee1515"/>
  <rect x="4" y="10" width="24" height="4" fill="#ee1515"/>

  <!-- Middle Bar (Black) -->
  <rect x="2" y="14" width="28" height="4" fill="#111111"/>

  <!-- Center Circle Outer (Black) -->
  <rect x="12" y="12" width="8" height="8" fill="#111111"/>
  <!-- Center Button (White) -->
  <rect x="13" y="13" width="6" height="6" fill="#f0f0f0"/>
  <!-- Center Button Core (Dark Gray) -->
  <rect x="15" y="15" width="2" height="2" fill="#555555"/>

  <!-- Bottom Half (White) -->
  <rect x="4" y="18" width="24" height="4" fill="#f0f0f0"/>
  <rect x="6" y="22" width="20" height="4" fill="#f0f0f0"/>
  <rect x="10" y="26" width="12" height="2" fill="#f0f0f0"/>
</svg>